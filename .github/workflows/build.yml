# Runs on a self-hosted Gitea Runner (act_runner) on Linux.
#
# Gitea reads both .gitea/workflows/ and .github/workflows/, so this file works
# on Gitea as-is and on the GitHub mirror, where it uses GitHub-hosted runners.
#
# Gitea-specific choices:
#   - actions/* are pinned to full commit SHAs because tags can be moved. Gitea
#     proxies `uses:` to github.com, but the action still has to run on a JS
#     runtime the runner provides. Renovate proposes updates.
#   - No `cache:` on setup-node. It needs the Actions cache service, which is
#     optional in act_runner and fails the step outright when disabled.
#   - No `concurrency:` block, which older Gitea versions reject at parse time.
#   - timeout-minutes is set so a hung job cannot occupy the single self-hosted
#     runner indefinitely.
name: Build and Lint

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # Matches the `engines.node` range in package.json, which in turn
        # tracks what Homebridge 2.x supports.
        node-version: [22.x, 24.x, 26.x]

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the job token out of .git/config, away from later steps.
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        # No dependency's install script is needed, so none get to run here.
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify the published package contents
        # Catches a required file dropping out of the tarball, or something
        # unexpected (such as a secret) getting in, before it can be published.
        run: npm run check:pack
